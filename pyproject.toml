[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesentinel"
version = "0.1.1"

description = "Lightweight, local-first network security monitoring and intrusion detection platform (Windows 11 -> Raspberry Pi 3B+)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "EdgeSentinel Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[project.scripts]
edgesentinel = "edgesentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
